; Card scanner / sleever / sorter motion controller
;   esp32s3 : ESP32-S3-DevKitC-1, host link on the native USB port (USB CDC)
;   native  : host unit tests for lib/ (JSON, sequencer on the physics model)
;   sim     : the real sequencer on the physics model, speaking the protocol on
;             stdin/stdout (tools/mcu_sim.py puts it behind a pty for host dev)
;
;   pio test -e native
;   pio run -e esp32s3 -t upload
;   pio run -e sim && python3 tools/mcu_sim.py
;
; No PlatformIO?  python3 tools/run_native_tests.py [--sim] builds the same tests
; and the simulator with g++ (Unity shim in tools/unity_shim).

[platformio]
default_envs = esp32s3

[env]
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall

[env:esp32s3]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_filter = +<esp32/>
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    gin66/FastAccelStepper@^0.30.0
    teemuatlut/TMCStepper@^0.7.3
lib_ignore = cs_sim
test_ignore = *

; host unit tests: pio test -e native
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = -std=gnu++17 -Wall -Wextra

; simulator: pio run -e sim  ->  .pio/build/sim/program
[env:sim]
platform = native
build_src_filter = +<sim/>
build_flags = -std=gnu++17 -Wall -Wextra
test_ignore = *
