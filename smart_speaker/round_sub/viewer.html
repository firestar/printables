<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Round sub enclosure viewer</title>
<style>
  body { margin: 0; background: #f4f4f4; font: 14px sans-serif; overflow: hidden; }
  #ui { position: absolute; top: 8px; left: 8px; background: #fffd; padding: 8px; border-radius: 6px; }
  #ui label { display: block; }
  #title { position: absolute; bottom: 10px; width: 100%; text-align: center; font-size: 18px; color: #333; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui">
  <label><input type="checkbox" id="section"> Cross-section</label>
  <label>Explode <input type="range" id="explode" min="0" max="100" value="0"></label>
</div>
<div id="title"></div>
<script type="module">
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// URL params: view=iso|front|top|bottom, section=1, explode=0..100, only=baffle|body|base, hideui=1, title=...
const q = new URLSearchParams(location.search);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.localClippingEnabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf4f4f4);
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 1, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 60);
camera.up.set(0, 0, 1);

scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(200, -300, 400);
scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.6);
fill.position.set(-300, 200, -100);
scene.add(fill);

const clip = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);  // section: keep the far (y >= 0) half
const parts = {                         // assembled-position copies in preview/
  baffle: { color: 0xa9824f },
  body:   { color: 0xdcbc8c },
  base: { color: 0x6a6f7a },
};
const meshes = {};
const loader = new STLLoader();
let loaded = 0;
for (const [name, p] of Object.entries(parts)) {
  loader.load(`preview/${name}.stl`, geo => {
    geo.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({
      color: p.color, roughness: 0.75, metalness: 0.0,
      side: THREE.DoubleSide, clippingPlanes: [], clipShadows: true,
    });
    const m = new THREE.Mesh(geo, mat);
    meshes[name] = m;
    scene.add(m);
    if (++loaded === 3) apply();
  });
}

const sectionEl = document.getElementById('section');
const explodeEl = document.getElementById('explode');
if (q.get('section') === '1') sectionEl.checked = true;
if (q.get('explode')) explodeEl.value = q.get('explode');
if (q.get('hideui') === '1') document.getElementById('ui').style.display = 'none';
document.getElementById('title').textContent = q.get('title') || '';
sectionEl.onchange = apply;
explodeEl.oninput = apply;

function apply() {
  const e = explodeEl.value / 100;
  meshes.baffle.position.z = e * 110;
  meshes.base.position.z = -e * 70;
  for (const m of Object.values(meshes)) {
    m.material.clippingPlanes = sectionEl.checked ? [clip] : [];
    m.material.needsUpdate = true;
  }
  const only = q.get('only');
  for (const [n, m] of Object.entries(meshes)) m.visible = !only || only === n;
}

const views = {
  iso:    [260, -300, 230],
  front:  [0, -480, 60],
  top:    [120, -160, 420],
  bottom: [180, -220, -220],
  lidtop: [120, -170, 230],
};
const v = views[q.get('view') || 'iso'];
camera.position.set(v[0], v[1], v[2]);
if (q.get('view') === 'lidtop' || q.get('view') === 'bottom') controls.target.set(0, 0, q.get('view') === 'bottom' ? 30 : 0);
const dist = parseFloat(q.get('dist') || '1.7');
camera.position.sub(controls.target).multiplyScalar(dist).add(controls.target);
controls.update();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
