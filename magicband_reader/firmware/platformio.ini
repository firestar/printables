; MagicBand-style door reader
;   reader          : split, outdoor pod. Waveshare ESP32-S3-Zero + PN532 + R503 + WS2812B + MAX98357A + MAX3485
;   reader_nofp     : split, same pod without the R503 (band only)
;   controller      : split, indoor ESP32-WROOM-32 devkit + MAX3485 + strike, WiFi + MQTT (Home Assistant)
;   reader_aio      : all-in-one ESP32-S3-Zero reader WITH R503: access engine, strike, REX, door, WiFi + MQTT
;   reader_aio_nofp : all-in-one without the R503
;   native          : host unit tests for lib/ (protocol, crypto, access policy, door core)
;
;   pio test -e native
;   pio run -e reader -t upload          (split: also flash `controller`)
;   pio run -e controller -t upload
;   pio run -e reader_aio -t upload      (all-in-one: this board only)
;
; Variant flags (include/config.h): HAS_FINGERPRINT=1/0, ALL_IN_ONE=1/0.

[platformio]
default_envs = reader, controller

[env]
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
    -Wall
    -Isrc/common
    -Isrc/door

; ---- shared sections -------------------------------------------------------------
[s3zero]
platform = espressif32@^6.9.0
; ESP32-S3-Zero: ESP32-S3FH4R2, 4 MB flash, 2 MB PSRAM, native USB
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
framework = arduino
monitor_speed = 115200
build_flags =
    ${env.build_flags}
    -DMB_ROLE_READER
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
reader_libs =
    adafruit/Adafruit NeoPixel@^1.12.3
    adafruit/Adafruit PN532@^1.3.3
fp_libs =
    adafruit/Adafruit Fingerprint Sensor Library@^2.1.3
test_ignore = *

; Wi-Fi / MQTT / Home Assistant door app (controller and all-in-one)
[door]
libs =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
    tzapu/WiFiManager@^2.0.17

; split reader: link to the controller, no radio
[reader_split]
extends = s3zero
board_build.partitions = default.csv
build_src_filter = +<common/> +<reader/>

; all-in-one: door app + Wi-Fi/MQTT on the reader, two ~1.9 MB OTA slots
[reader_allinone]
extends = s3zero
board_build.partitions = min_spiffs.csv
build_src_filter = +<door/> +<reader/>

; ---- environments ---------------------------------------------------------------
[env:reader]
extends = reader_split
build_flags = ${s3zero.build_flags} -DHAS_FINGERPRINT=1 -DALL_IN_ONE=0
lib_deps =
    ${s3zero.reader_libs}
    ${s3zero.fp_libs}

[env:reader_nofp]
extends = reader_split
build_flags = ${s3zero.build_flags} -DHAS_FINGERPRINT=0 -DALL_IN_ONE=0
lib_deps =
    ${s3zero.reader_libs}

[env:reader_aio]
extends = reader_allinone
build_flags = ${s3zero.build_flags} -DHAS_FINGERPRINT=1 -DALL_IN_ONE=1
lib_deps =
    ${s3zero.reader_libs}
    ${s3zero.fp_libs}
    ${door.libs}

[env:reader_aio_nofp]
extends = reader_allinone
build_flags = ${s3zero.build_flags} -DHAS_FINGERPRINT=0 -DALL_IN_ONE=1
lib_deps =
    ${s3zero.reader_libs}
    ${door.libs}

[env:controller]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
; two ~1.9 MB app slots so OTA updates fit
board_build.partitions = min_spiffs.csv
build_src_filter = +<common/> +<controller/> +<door/>
build_flags =
    ${env.build_flags}
    -DMB_ROLE_CONTROLLER
lib_deps =
    ${door.libs}
test_ignore = *

; host unit tests: pio test -e native
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = -std=gnu++17 -Wall -Wextra
