; Rotating aeroponic grow tower firmware
; ESP32-WROOM-32 devkit (30-pin) + 12 V pump (MOSFET module) + 28BYJ-48 12 V stepper (ULN2003)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
; two ~1.9 MB app slots so OTA updates fit
board_build.partitions = min_spiffs.csv
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    tzapu/WiFiManager@^2.0.17
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    waspinator/AccelStepper@^1.64
test_ignore = test_scheduler

; host unit tests for the pure scheduler: pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<scheduler.cpp>
build_flags = -std=gnu++17 -Wall -Wextra
